name: Preflight CI Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hindsight-client==0.10.1 groq==1.7.0 fastapi uvicorn pydantic pytest httpx python-dotenv

      - name: Run Tests (Memory, Leakage & API)
        env:
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BASE_URL: ${{ secrets.HINDSIGHT_BASE_URL || 'https://api.hindsight.vectorize.io' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest -v backend/tests/
