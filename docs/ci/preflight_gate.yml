# Live Production Gate Workflow for GitHub Actions
# Reference implementation for integrating Preflight into CI/CD release pipelines

name: Preflight Pipeline Gate

on:
  pull_request:
    branches: [ main, production ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main, production ]

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight-risk-gate:
    name: Preflight Deployment Safety Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install hindsight-client==0.10.1 groq==1.7.0 pydantic requests pyyaml

      - name: Evaluate Preflight Release Gate
        id: gate_check
        env:
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
          HINDSIGHT_BASE_URL: ${{ secrets.HINDSIGHT_BASE_URL || 'https://api.hindsight.vectorize.io' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m backend.agent.gate --pr-event "$GITHUB_EVENT_PATH"
